<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO: Sahifa sarlavhasi dinamik chiqadi -->
  <title>
    {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>

  <!-- SEO meta-teglari (jekyll-seo-tag plugin) -->
  {% seo %}

  <!-- =====================================================
       Bootstrap 5 CDN — Toza grid va responsive dizayn
  ====================================================== -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- =====================================================
       Google Fonts — IBM Plex Mono (terminal hissi) +
       Source Serif 4 (o'qish uchun qulay serif)
  ====================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- =====================================================
       Minimal Toza CSS — Saytning asosiy ko'rinishi
  ====================================================== -->
  <style>
    /* === O'zgaruvchilar (CSS Variables) =================== */
    :root {
      --color-bg:          #ffffff;
      --color-text:        #111111;
      --color-muted:       #6b6b6b;
      --color-border:      #e2e2e2;
      --color-accent:      #111111;
      --color-link:        #111111;
      --color-link-hover:  #444444;

      /* Kod bloki — terminal uslubi */
      --code-bg:           #0d0d0d;
      --code-text:         #e8e8e8;
      --code-border:       #2a2a2a;

      /* Tipografiya */
      --font-body:         'Source Serif 4', Georgia, serif;
      --font-mono:         'IBM Plex Mono', 'Courier New', monospace;

      /* Kenglik va bo'shliqlar */
      --content-width:     680px;   /* O'qishga ideal kenglik */
      --nav-height:        60px;
    }

    /* === Umumiy Reset va Asos ============================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 17px;          /* Asos shrift o'lchami */
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === Havolalar ======================================== */
    a {
      color: var(--color-link);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--color-link-hover);
    }

    /* ======================================================
       HEADER / NAVIGATSIYA
    ====================================================== */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      height: var(--nav-height);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
    }

    .site-header .container {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo / Sayt nomi */
    .site-logo {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }

    .site-logo::before {
      content: "> ";
      color: var(--color-muted);
    }

    .site-logo:hover {
      color: var(--color-text);
      opacity: 0.75;
    }

    /* Navigatsiya havolalar */
    .site-nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }

    .site-nav a {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      text-decoration: none;
      color: var(--color-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.15s ease;
    }

    .site-nav a:hover,
    .site-nav a.active {
      color: var(--color-text);
    }

    /* ======================================================
       ASOSIY KONTENT MAYDONI
    ====================================================== */
    .site-main {
      flex: 1;
      padding: 3.5rem 1.5rem;
      max-width: var(--content-width);
      margin: 0 auto;
      width: 100%;
    }

    /* ======================================================
       TIPOGRAFIYA — Maqola ichidagi matnlar
    ====================================================== */
    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4 {
      font-family: var(--font-body);
      font-weight: 600;
      line-height: 1.3;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      color: var(--color-text);
    }

    .post-content h1 { font-size: 2rem; }
    .post-content h2 { font-size: 1.5rem; }
    .post-content h3 { font-size: 1.2rem; }

    .post-content p {
      margin-bottom: 1.4rem;
    }

    .post-content ul,
    .post-content ol {
      padding-left: 1.5rem;
      margin-bottom: 1.4rem;
    }

    .post-content li {
      margin-bottom: 0.35rem;
    }

    .post-content blockquote {
      border-left: 3px solid var(--color-border);
      padding: 0.25rem 1.25rem;
      margin: 2rem 0;
      color: var(--color-muted);
      font-style: italic;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2.5rem 0;
    }

    /* ======================================================
       KOD BLOKLARI — Terminal uslubi
    ====================================================== */

    /* Inline kod */
    code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: #f4f4f4;
      color: #c0392b;
      padding: 0.1em 0.4em;
      border-radius: 3px;
    }

    /* Blok kodi (``` ```) */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      margin: 1.75rem 0;
      position: relative;
    }

    /* Terminal sarlavha chizig'i effekti */
    pre::before {
      content: "● ● ●";
      display: block;
      color: #444;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      margin-bottom: 0.85rem;
      font-family: var(--font-mono);
    }

    pre code {
      background: transparent;
      color: var(--code-text);
      font-size: 0.88rem;
      padding: 0;
      border-radius: 0;
      line-height: 1.6;
    }

    /* ======================================================
       FOOTER
    ====================================================== */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: 1.5rem;
      text-align: center;
    }

    .site-footer p {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--color-muted);
      margin: 0;
    }

    /* ======================================================
       RESPONSIVE — Mobil qurilmalar
    ====================================================== */
    @media (max-width: 600px) {
      html { font-size: 16px; }
      .site-main { padding: 2rem 1.25rem; }
      .site-nav { gap: 1.25rem; }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       HEADER — Tepadagi navigatsiya
  ====================================================== -->
  <header class="site-header">
    <div class="container">

      <!-- Logo / Sayt nomi -->
      <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>

      <!-- Navigatsiya menyusi — _config.yml dan o'qiladi -->
      <nav aria-label="Asosiy menyu">
        <ul class="site-nav">
          {% for item in site.navigation %}
            <li>
              <a
                href="{{ item.url | relative_url }}"
                {% if page.url == item.url %}class="active" aria-current="page"{% endif %}
              >
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </nav>

    </div>
  </header>

  <!-- ======================================================
       ASOSIY KONTENT — Har bir sahifa shu joyga kiritiladi
  ====================================================== -->
  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  <!-- ======================================================
       FOOTER — Pastki qism
  ====================================================== -->
  <footer class="site-footer">
    <p>Copyright &copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Barcha huquqlar himoyalangan.</p>
  </footer>

  <!-- Bootstrap JS (Dropdown/Collapse kerak bo'lsa) — Minimal yuk -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmrXEsReo5m31JgkBW3kM8eUhuRuA"
    crossorigin="anonymous"
    defer
  ></script>

</body>
</html>
